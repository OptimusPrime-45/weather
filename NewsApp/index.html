<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Live News</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
      background-color: #f5f5f5;
    }
    header {
      background-color: #1e88e5;
      color: white;
      padding: 1rem;
      text-align: center;
    }
    main {
      padding: 1rem;
      max-width: 900px;
      margin: auto;
    }
    form {
      margin-bottom: 1rem;
      display: flex;
      justify-content: center;
    }
    input[type="text"] {
      padding: 0.5rem;
      width: 300px;
      border: 1px solid #ccc;
      border-radius: 4px;
    }
    button {
      padding: 0.5rem 1rem;
      margin-left: 0.5rem;
      background-color: #1e88e5;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }
    .news-container {
      display: grid;
      grid-template-columns: 1fr;
      gap: 1rem;
    }
    .news-item {
      background-color: white;
      padding: 1rem;
      border-radius: 8px;
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
    }
    .news-item h3 {
      margin: 0 0 0.5rem 0;
    }
    .news-item p {
      margin: 0.5rem 0;
    }
    .news-item a {
      color: #1e88e5;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <header>
    <h1>Live News by Location</h1>
  </header>
  <main>
    <form id="locationForm">
      <input type="text" id="locationInput" placeholder="Enter location (e.g., India, US)" required />
      <button type="submit">Get News</button>
    </form>
    <div class="news-container" id="newsContainer"></div>
  </main>
  <script>
    const form = document.getElementById('locationForm');
    const input = document.getElementById('locationInput');
    const newsContainer = document.getElementById('newsContainer');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const location = input.value.trim();
      if (!location) return;
      newsContainer.innerHTML = '<p>Loading news...</p>';
      
      try {
        const response = await fetch(`https://newsdata.io/api/1/news?apikey=pub_79569f1258d020e76d42e6169047e21041ae4&country=${location}&language=en`);
        const data = await response.json();

        if (!data.results || data.results.length === 0) {
          newsContainer.innerHTML = '<p>No news found for this location.</p>';
          return;
        }

        newsContainer.innerHTML = data.results.map(news => `
          <div class="news-item">
            <h3>${news.title}</h3>
            <p>${news.description || 'No description available.'}</p>
            <a href="${news.link}" target="_blank">Read more</a>
          </div>
        `).join('');
      } catch (err) {
        console.error(err);
        newsContainer.innerHTML = '<p>Error fetching news. Please try again.</p>';
      }
    });
  </script>
</body>
</html>
